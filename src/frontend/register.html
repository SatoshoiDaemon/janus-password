<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janus · Criar seu cofre</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Janus</h1>
                    <p>Crie um cofre pessoal para este dispositivo.</p>
                </div>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Escolha um usuário"
                            minlength="3"
                            required
                        >
                        <small>Mínimo 3 caracteres</small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Crie uma senha segura"
                                minlength="6"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                Mostrar senha
                            </button>
                        </div>
                        <small>Mínimo 6 caracteres</small>
                    </div>

                    <div class="form-group">
                        <label for="passwordConfirm">Confirmar Senha</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="passwordConfirm" 
                                name="passwordConfirm" 
                                placeholder="Confirme sua senha"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePasswordConfirm">
                                Mostrar senha
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Registrar
                    </button>
                </form>

                <div class="form-divider">
                    <span>ou</span>
                </div>

                <p class="text-center">
                    Já tem uma conta? 
                    <a href="/login" class="link">Faça login aqui</a>
                </p>

                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const togglePassword = document.getElementById('togglePassword');
        const togglePasswordConfirm = document.getElementById('togglePasswordConfirm');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const messageDiv = document.getElementById('message');

        // Toggle visibilidade da senha
        togglePassword.addEventListener('click', function(e) {
            e.preventDefault();
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? '👁' : '🙈';
        });

        // Toggle visibilidade da confirmação de senha
        togglePasswordConfirm.addEventListener('click', function(e) {
            e.preventDefault();
            const type = passwordConfirmInput.type === 'password' ? 'text' : 'password';
            passwordConfirmInput.type = type;
            this.textContent = type === 'password' ? '👁' : '🙈';
        });

        // Submit do formulário
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            // Validar senhas iguais
            if (password !== passwordConfirm) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'As senhas não conferem!';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        password_confirm: passwordConfirm
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Registro realizado com sucesso! Redirecionando para login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.error || 'Erro ao registrar';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Erro ao conectar ao servidor';
                console.error('Erro:', error);
            }
        });
    </script>
</body>
</html>
