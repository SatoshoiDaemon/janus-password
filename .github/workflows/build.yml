name: Local application builds
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1577836800'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/build_app.py
      - run: python scripts/build_extension.py
      - name: Include importer and application sources
        if: runner.os == 'Linux'
        run: python scripts/source_bundle.py
      - run: python scripts/verify_reproducible.py
      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then dist/JanusCLI/JanusCLI.exe --help; else dist/JanusCLI/JanusCLI --help; fi
      - name: Native authenticated lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export JANUS_SMOKE_EXECUTABLE="$PWD/dist/Janus/Janus.exe"; else export JANUS_SMOKE_EXECUTABLE="$PWD/dist/Janus/Janus"; fi
          python -m pytest -q tests/test_distribution.py::test_launcher_single_instance_and_authenticated_shutdown
      - name: Linux portable installer
        if: runner.os == 'Linux'
        run: |
          cp packaging/install.sh dist/install.sh
          tar --sort=name --mtime=@1577836800 --owner=0 --group=0 --numeric-owner -C dist -czf dist/Janus-Linux.tar.gz Janus JanusCLI install.sh
          test_home=$(mktemp -d)
          XDG_DATA_HOME="$test_home/data" JANUS_INSTALL_HOME="$test_home" sh dist/install.sh
          "$test_home/.local/bin/janus-cli" --help
      - name: Windows installer and clean silent installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/windows.iss
          $target = Join-Path $env:RUNNER_TEMP 'Janus-install'
          Start-Process -FilePath dist/Janus-0.3.0-Windows-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$target" -Wait
          & "$target\JanusCLI\JanusCLI.exe" --help
      - name: SHA256 checksums
        shell: bash
        run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: Janus-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*Setup.exe
            dist/*.zip
            dist/*-SHA256SUMS.txt
  attest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/**/*'
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*/*.tar.gz release/*/*Setup.exe release/Janus-Linux/*.zip release/*/*-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --generate-notes
